name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Generate third-party notices
        run: |
          set -euo pipefail
          {
            echo "Third-party dependencies bundled in the sgl CLI, with their licences."
            echo "Generated by go-licenses v2 at release time."
            echo
            printf '%-60s %-14s %s\n' "MODULE" "LICENCE" "SOURCE"
          } > THIRD-PARTY-NOTICES.txt
          (cd cmd/sgl && go-licenses report --ignore seagull.sh/seagull ./...) \
            | sort -u \
            | while IFS=, read -r module url licence; do
                printf '%-60s %-14s %s\n' "$module" "$licence" "$url"
              done >> THIRD-PARTY-NOTICES.txt
          test -s THIRD-PARTY-NOTICES.txt

      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X 'seagull.sh/seagull/cmd/sgl/internal/buildinfo.Version=${GITHUB_REF_NAME}' -X 'seagull.sh/seagull.Version=${{ steps.version.outputs.version }}'" \
            -o "dist/sgl${ext}" ./cmd/sgl

      - name: Record binary digests
        working-directory: dist
        run: sha256sum ./* | sed 's|\./||' > SHA256SUMS

      - name: Stage licence and documentation files
        run: cp LICENSE NOTICE README.md THIRD-PARTY-NOTICES.txt dist/

      - name: Archive
        run: |
          set -euo pipefail
          name="sgl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -qr "../${name}.zip" .)
          else
            tar -czf "${name}.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sgl-*.tar.gz
            sgl-*.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Tag command sub-modules
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"

          modules=$(grep -oP '^\s+\./\Kcmd/\S+' go.work)

          echo "${modules}" | while read -r module; do
            sed -i "s|seagull.sh/seagull\(.*\) v0\.0\.0|seagull.sh/seagull\1 ${version}|g" "${module}/go.mod"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/
          git commit -m "release: update command module versions to ${version}"

          echo "${modules}" | while read -r module; do
            tag="${module}/${version}"
            echo "Creating tag: ${tag}"
            git tag "${tag}"
          done
          git push origin --tags

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cli-*
          path: release-artefacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artefacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: sha256sum ./* | sed 's|\./||' > checksums-sha256.txt

      - name: Determine pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes from commits
        id: notes
        run: |
          previous_tag=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${{ github.ref_name }}"
          else
            range="${{ github.ref_name }}"
          fi

          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "## Commits"
            echo ""
            git log --no-merges --format="- %s (%h)" "$range"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          name: Seagull ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: release/*

  sign-release:
    name: Sign Release Artefacts
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cli-*
          path: release-artefacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artefacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom-tmp
          for archive in release/*.tar.gz release/*.zip; do
            [ -f "$archive" ] || continue
            base=$(basename "$archive")
            dir="sbom-tmp/${base%.*}"
            mkdir -p "$dir"
            case "$archive" in
              *.tar.gz) tar xzf "$archive" -C "$dir" ;;
              *.zip)    unzip -q "$archive" -d "$dir" ;;
            esac
            syft "dir:${dir}" -o cyclonedx-json --file "release/${base}.sbom.cdx.json"
            syft "dir:${dir}" -o spdx-json --file "release/${base}.sbom.spdx.json"
          done
          rm -rf sbom-tmp

      - name: Sign artefacts with cosign (keyless)
        run: |
          set -euo pipefail
          for file in release/*; do
            [ -f "$file" ] || continue
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.cert" \
              "$file"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Upload signatures and SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            release/*.sig \
            release/*.cert \
            release/*.sbom.cdx.json \
            release/*.sbom.spdx.json \
            --clobber
