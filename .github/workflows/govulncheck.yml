name: govulncheck

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (library)
        run: govulncheck ./...

      - name: Run govulncheck (cmd/sgl)
        working-directory: cmd/sgl
        run: govulncheck ./...

      - name: Run govulncheck (cmd/seagull)
        working-directory: cmd/seagull
        run: govulncheck ./...
