name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needs to be run on the following files:"
            echo "$files"
            exit 1
          fi

      - name: Vet every build tag and cross-compile target
        run: make lint-vet-tags

      - name: Build
        run: go build ./...

      - name: Build cmd/sgl
        working-directory: cmd/sgl
        run: go build ./...

      - name: Build cmd/seagull
        working-directory: cmd/seagull
        run: go build ./...

      - name: Test library
        run: go test -shuffle=on ./...

      - name: Test CLI
        working-directory: cmd/sgl
        run: go test -shuffle=on ./...

      - name: Test the seagull command
        working-directory: cmd/seagull
        run: go test -shuffle=on ./...

      - name: Test facade
        working-directory: tests/facade
        run: go test -shuffle=on ./...

      - name: Test the integration harness
        working-directory: tests/integration/internal/harness
        run: go test -shuffle=on ./...

      - name: Test the import formatter against goimports
        run: make test-formatcheck

  compile:
    name: Compile suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Generate every case for every emitter, vet and build
        run: make test-compile

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Vet, build and test every examples module
        run: make test-examples

      - name: Test the tutorials
        run: make test-tutorials

  integration:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [postgres, cockroachdb, timescaledb, mysql, mariadb, sqlite, sqlite_cgo, clickhouse, duckdb]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Run the integration suite
        run: make test-integration ARGS=${{ matrix.suite }}

  build-wasm:
    name: Build and test js/wasm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Build and test the WebAssembly runtime, natively and under Node
        run: make test-wasm

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: "**/go.sum"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint every workspace module
        run: make lint-go

  lint-scripts:
    name: Lint Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run shellcheck
        run: make lint-scripts

  go-mod-verify:
    name: Verify go.mod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Verify all go.mod files are tidy
        run: make go-mod-verify

  verify:
    name: Verify generated files and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Verify generated files
        run: make generate-all-validate

  ci-ok:
    name: CI
    if: always()
    needs:
      - build-and-test
      - compile
      - examples
      - integration
      - build-wasm
      - lint
      - lint-scripts
      - go-mod-verify
      - verify
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::One or more CI jobs did not succeed: $results"
              exit 1
            fi
          done
          echo "All CI checks passed"
