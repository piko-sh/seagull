summary: One observe.ObserverPort prints every stage of a generation and a migration run as an indented tree, and an slog logger at Seagull's trace level shows the generator's and migrator's log, with a fixed clock so nothing changes between runs.
differs:
  - "the generator reports generate, its catalogue and analysis stages, and one span per migration replayed and per query; the migrator reports migrate.up and migrate.status"
  - "Start returns a context, so the observer keeps the nesting depth in it, as a tracer keeps its parent span"
  - "Seagull logs its internals at slog.Level(-8), below Debug; WithClock fixes the elapsed time the trace log prints"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: in-process
