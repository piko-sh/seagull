summary: An emit.EmitterPort wraps the database/sql emitter and adds query_index.go, a list of every query with its command and whether it only reads, written with the style's header so WriteFiles prunes it like any generated file.
differs:
  - "the wrapper forwards emit.TypeDefaulterPort, which the generator looks for on the emitter it was given"
  - the extra file is built from emit.Request's analysed queries and formatted with go/format
  - "the committed internal/store comes from go run . -write; the stock sgl generate would prune query_index.go, which only this emitter writes (053 builds an sgl that keeps it)"
entry: {file: db/queries/tasks.sql, query: ListTasks}
live: "no"
test: in-process
