summary: A Go program builds a generator with dialects.New("sqlite") and a type override, generates the store package, writes it with WriteFiles, and has a check mode that reports what WriteFiles would change.
differs:
  - "dialects.New picks the SQLite dialect by name, as a tool reading its own configuration would"
  - "the default emitter is database/sql, which also writes prepared.go; sgl.yaml sets go.prepared: true so sgl generate agrees"
  - "the check compares each generated file and looks for files with the generated header that this run would prune"
entry: {file: db/queries/notes.sql, query: ListNotes}
live: "no"
test: in-process
