summary: slugify is a Go function registered with modernc.org/sqlite; declared through custom_functions or WithCustomFunctions, Seagull types the queries that call it, and the generated methods run it inside SQLite.
differs:
  - "modernc.org/sqlite registers Go functions for every new connection with RegisterDeterministicScalarFunction"
  - "undeclared, slugify(title) has an unknown type and is nullable; declared with null_on_null on a NOT NULL argument it is a non-null text, so the field is a string"
  - "a parameter compared with a function's result is not typed from it, so FindArticleBySlug declares type: text"
  - "undeclared, slugify draws warning Q005, unknown function, at each query that calls it"
entry: {file: db/queries/articles.sql, query: ListArticleSlugs}
live: "no"
test: in-process
