summary: A main package calls cli.Main with WithDialect, WithEmitter and WithDriver to build an sgl whose SQLite has tighter parser limits, whose database/sql emitter also writes query_index.go, and which links the pure-Go SQLite driver.
differs:
  - "it replaces the stock sqlite dialect and database/sql emitter by registering the same names, so sgl.yaml stays dialect: sqlite with the default driver"
  - "the dialect factory receives dialect_options from sgl.yaml as dialects.Options; max_parse_depth: 128 overrides this sgl's default of 64"
  - "the emitter factory receives go.prepared through cli.EmitterRequest; the stock emitter picks its driver profile from the dialect it is given"
  - "cli links no database driver; importing modernc.org/sqlite and WithDriver(\"sqlite\", \"sqlite\") let migrate, seed and schema diff connect"
  - "the test runs generate --check and vet --strict through cli.MainContext with the same options"
entry: {file: db/queries/tasks.sql, query: ListTasks}
live: "no"
test: generate-only
