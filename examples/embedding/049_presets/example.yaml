summary: "A tool that embeds Seagull white-labels it: FormatDirectives converts the queries to the acme. prefix, WithPreset generates with Acme's header, helper and error names and query-names file, nothing generated says sgl, and WithLegacyHeaders prunes the file the stock header marked."
differs:
  - "the preset starts from DefaultPreset; sgl becomes a foreign prefix, so an unconverted directive draws Q051"
  - "helpers become acme..., sentinel errors ErrAcme..., and error text starts acme:"
  - "query_names.go was renamed acme_query_names.go, so only WithLegacyHeaders lets WriteFiles prune the old file"
  - the acme package is written to a temporary directory, since its header is not sgl's
entry: {file: db/queries/parcels.sql, query: SearchParcels}
live: "no"
test: in-process
