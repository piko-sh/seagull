summary: A small linter vets the queries from Go, prints each one's parameters, columns, nullability and whether it only reads, adds a rule of its own, prints the catalogue's tables, and shows which error sentinels each kind of failure matches.
differs:
  - "INTEGER PRIMARY KEY is bigint in the analysis, as the rowid, and other INTEGER columns integer; both map to int64"
  - a column from the outer side of the LEFT JOIN is nullable even though tags.name is NOT NULL
  - "error diagnostics arrive through Report.Err as a *DiagnosticsError; configuration and limit problems are errors from New, Generate and Vet"
entry: {file: db/queries/notes.sql, query: ListNotesWithTags}
live: "no"
test: in-process
