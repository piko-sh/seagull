summary: With no migration files, WithSchemaSource(schema_source_sqlite) reads the tables of a live SQLite database through PRAGMA, and the generator types the queries against them; schema_from in sgl.yaml does the same for sgl.
differs:
  - "schema_source_sqlite reads PRAGMA table_xinfo and index lists; the dialect normalises the declared types, so INTEGER PRIMARY KEY is bigint, as the rowid, and other INTEGER columns integer, all mapping to int64"
  - "schema_from: file:club.db replaces migrations in sgl.yaml; the path is resolved against the directory that holds sgl.yaml, and sgl refuses a file that does not exist"
  - Input.Migrations is nil, so the queries come from Input.Queries
entry: {file: db/queries/club.sql, query: ListSightings}
live: "no"
test: in-process
