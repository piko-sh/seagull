summary: A migration turns readings into a hypertable with create_hypertable; time_bucket, time_bucket_gapfill with locf, and first and last summarise two buoys' sea temperatures with typed rows.
differs:
  - the first migration runs CREATE EXTENSION IF NOT EXISTS timescaledb, then create_hypertable, which Seagull reads as a note on the table rather than a change to its columns
  - time_bucket returns timestamptz as time.Time; time_bucket_gapfill's bucket arrives as *time.Time
  - the bucket width is written INTERVAL '1 hour'; a bare '1 hour' reads as an interval too
  - first, last and locf are polymorphic; Seagull types first and last from their value but leaves locf of an aggregate as any, so the queries cast them to double precision
  - the gapfill bounds are cast to timestamptz, because PostgreSQL cannot infer a parameter's type from time_bucket_gapfill
entry: {file: db/queries/readings.sql, query: GapfilledHourly}
live: "no"
test: integration
