summary: A chip shop menu priced by a lambda SQL function that a migration creates with CREATE OR REPLACE FUNCTION, called like a built-in from a query.
differs:
  - "A ClickHouse SQL function is a lambda, CREATE FUNCTION name AS args -> expression, with no body language, volatility or RETURNS clause"
  - "Functions belong to the server, not the database, so the migration uses CREATE OR REPLACE and the down migration DROP FUNCTION IF EXISTS"
  - "A lambda cannot read or write tables, so sgl.migration(readonly:) has nothing to override"
  - "Seagull types a call to a lambda from its body: price_pence * 110 widens UInt32 to UInt64, so TotalPence is uint64, and the call reads no table, so the query is routed to the reader"
entry: {file: db/migrations/0002_with_service.up.sql}
live: "no"
test: integration
