summary: Beach huts found and booked over a native connection, each Go slice bound as one {name:Array(T)} parameter through clickhouse.Named.
differs:
  - "IN {beaches:Array(String)} takes the whole slice as one array parameter, so no kind: slice is needed and nothing is rewritten at call time"
  - "Both drivers bind the slice as text: the native method, like database/sql, writes it as one array literal with the generated clickhouse_values.go before clickhouse.Named"
  - "An empty slice is an empty array, so IN [] matches nothing"
  - "Q017 and Q018 do not arise, since an Array parameter is not expanded"
  - "The native driver reports no changed rows, so BookHuts is asyncexec and the example counts booked huts before and after"
entry: {file: db/queries/huts.sql, query: HutsOnBeaches}
live: "no"
test: integration
