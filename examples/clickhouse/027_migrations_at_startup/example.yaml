summary: The migration files are embedded in the binary, and each start-up runs migrate.NewMigrator with the ClickHouse backend and Up, which applies only what the database lacks.
differs:
  - "migrate_backend_clickhouse.New() runs each statement of a migration without a transaction and records the migration once all of them succeed"
  - "The ClickHouse backend takes no lock; coordinate start-ups that migrate in parallel outside the migrator"
  - "The history lives in sgl_migrations, an append-only ReplacingMergeTree read with FINAL"
  - "ALTER TABLE ... ADD COLUMN with a DEFAULT adds the column; existing rows read the default"
entry: {file: db/migrations/0002_boat_home_port.up.sql}
live: "no"
test: integration
