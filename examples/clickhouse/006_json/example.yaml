summary: Chip shop orders kept as JSON text in String columns, encoded with json.Marshal and searched with JSONExtractString and JSONExtractRaw.
differs:
  - "The documents live in String and Nullable(String) columns, so they map to string and *string rather than the generated JSON type"
  - "JSON functions replace operators: JSONExtractString extracts a value as text and JSONExtractRaw a fragment's JSON text"
  - "JSONExtractString returns an empty string, not NULL, for a missing key; only a NULL document gives NULL"
  - "JSONExtractRaw returns a String, so Extras is a string; JSONExtractString of the Nullable(String) delivery column is Nullable, so Address is *string"
  - "ClickHouse's JSON column type maps to the generated JSON type, and a path such as basket.fish is Dynamic, which maps to any, so the example keeps to String"
entry: {file: db/queries/orders.sql, query: OrdersWithFish}
live: "no"
test: integration
