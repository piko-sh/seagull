summary: Hauls of fish with Array(String) and Array(UInt32) columns, landed from Go slices and read back as []string and []uint32, filtered on the server with has().
differs:
  - "Array(T) maps to []T in rows and parameters; the generated method formats a slice parameter as one array literal"
  - "An Array column cannot be Nullable, so an empty slice stores an empty array, never NULL"
  - "has(array, value) tests membership on the server"
entry: {file: db/queries/hauls.sql, query: HaulsWith}
live: "no"
test: integration
