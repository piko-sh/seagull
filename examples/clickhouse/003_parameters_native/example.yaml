summary: The ferry timetable over a native clickhouse-go connection, where each {name:Type} placeholder becomes a field bound as clickhouse.Named("p_<name>", ...).
differs:
  - "Placeholders are {name:Type}: the name becomes the field and the type sets the Go type, so nothing is inferred from columns and no binding line is needed"
  - "The native emitter binds each value with clickhouse.Named(\"p_<name>\", ...), formatted by the generated clickhouse_values.go, which escapes backslashes, tabs, newlines, carriage returns and NULs"
  - "{seats:Int32} appears twice in BookSeats but is one field, bound once"
  - "The native driver reports no changed rows, so BookSeats is asyncexec and the example compares seats_free before and after the booking"
  - No auto-increment, so each sailing's id is a parameter
entry: {file: db/queries/sailings.sql, query: FindSailings}
live: "no"
test: integration
