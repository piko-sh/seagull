summary: One boat trip search run four ways, where each optional filter is a Nullable placeholder, its field a pointer, and a nil pointer switches the filter off.
differs:
  - "Each optional placeholder is typed Nullable(T), as in {destination:Nullable(String)}; a non-Nullable placeholder reads the NULL marker as text and the filter silently matches nothing"
  - "A {name:Type} placeholder may appear twice in a filter and still binds once, so no numbered placeholders are needed"
  - "The binding line names the placeholder, as in -- {destination:Nullable(String)} as sgl.param(destination, optional: true)"
  - "Nullable(T) already makes the field a pointer; optional: true records that leaving the filter out is intended"
entry: {file: db/queries/trips.sql, query: SearchTrips}
live: "no"
test: integration
