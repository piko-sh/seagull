summary: Fishing licences renewed and purged with ALTER TABLE UPDATE and DELETE declared asyncexec, made to wait with mutations_sync, beside a lightweight DELETE declared exec.
differs:
  - "ALTER TABLE ... UPDATE and ALTER TABLE ... DELETE queue a mutation; asyncexec gives an error-only method whose doc comment says a nil error means queued"
  - "Declaring such a query exec works but sgl vet hints Q040; Q041, asyncexec on an engine without asynchronous mutations, cannot arise on ClickHouse"
  - "mutations_sync=2 on the connection, or SETTINGS mutations_sync = 2 in the statement, makes the server wait until every replica has applied the mutation"
  - "A lightweight DELETE FROM returns once the rows are marked deleted, so it is a plain exec"
  - "No mutation reports changed rows"
entry: {file: db/queries/licences.sql, query: RenewLicence}
live: "no"
test: integration
