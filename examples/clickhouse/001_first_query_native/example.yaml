summary: The tasks example over a native clickhouse-go connection; the same queries generate methods on driver.Conn, migrated first through the driver's database/sql adapter.
differs:
  - "sgl.yaml sets go.driver: clickhouse, so store.New takes a native connection (the DBTX subset of driver.Conn) instead of *sql.DB"
  - "Parameters bind as clickhouse.Named(\"p_<name>\", ...), formatted as text by the generated clickhouse_values.go"
  - The migrator runs on database/sql, so main.go migrates through clickhouse.OpenDB and then opens clickhouse.Open with the same options
  - "No WithTx, RunInTx or NewWithReplica: ClickHouse has no transactions and the native emitter has no replica routing"
  - "execrows and execresult are refused, as the native driver reports no affected rows; CompleteTask is asyncexec"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: integration
