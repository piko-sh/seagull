summary: Rock pool finds read a page at a time, with a default and a maximum page size, then searched with an optional filter and a page.
differs:
  - "LIMIT and OFFSET take {name:Type} placeholders, as in LIMIT {page_size:UInt32}; a placeholder that is the whole count becomes a plain int, as on the other engines"
  - "The binding line names the placeholder, as in -- {page_size:UInt32} as sgl.param(page_size, default: 3, max: 5); page_offset needs no line, as the placeholder already names it"
  - "The optional creature filter is a Nullable(String) placeholder, which appears twice and still binds once"
  - "No auto-increment, so each find's id is a parameter"
entry: {file: db/queries/finds.sql, query: ListFinds}
live: "no"
test: integration
