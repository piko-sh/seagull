summary: Promenade kiosks with LowCardinality, Array, Map, Tuple and IPv4 columns, stored from Go values, read back and unrolled with ARRAY JOIN.
differs:
  - "LowCardinality(String) is a storage hint and maps to string"
  - "ARRAY JOIN gives one row per array element, so the joined tag is a plain string"
  - "A Map or Array parameter is one value, as in {prices:Map(String, UInt32)}"
  - "The Tuple is written from scalar parameters, ({lat:Float64}, {lon:Float64}); a {location:Tuple(lat Float64, lon Float64)} parameter would take a map[string]any keyed by element name"
  - "Map(String, UInt32) maps to map[string]uint32; through database/sql the named Tuple maps to map[string]any and IPv4 to net.IP, the types clickhouse-go's bridge scans into"
entry: {file: db/queries/kiosks.sql, query: KiosksByTag}
live: "no"
test: integration
