summary: A day of tide readings written with one batch call, which the native driver sends as a single INSERT through PrepareBatch, landing as one part.
differs:
  - "batch calls PrepareBatch, batch.Append for each row and batch.Send: one INSERT with the rows sent column by column, with no bind variables and no chunking"
  - "The {name:Type} placeholders in VALUES only name and type the columns; the values come from Append"
  - copyfrom generates the same PrepareBatch code as batch
  - "Each INSERT writes one part that ClickHouse merges later, so batching keeps the part count down; the example counts parts with the _part virtual column"
  - "An empty slice returns at once, without preparing an INSERT or contacting the server"
  - "Q017 does not arise: no parameter is kind: slice, and an Array value is one column value"
entry: {file: db/queries/readings.sql, query: RecordReadings}
live: "no"
test: integration
