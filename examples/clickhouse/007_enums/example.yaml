summary: Harbour boats with an Enum8 status, read as the store.BoatsStatus type Seagull generates and then as the harbour's own domain.Status through a go_type override.
differs:
  - "An Enum8 or Enum16 column becomes a named string type in models.go, named after its table and column (store.BoatsStatus), with a constant per label and a Valid method; ClickHouse refuses a label the enum does not list"
  - "The status parameter is {status:String}; the server converts the label to the Enum8 on insert and comparison"
  - "sgl.column(status, go_type: ...) types only that query's result rows, so parameters stay string and the example converts with string(domain.StatusInDock)"
entry: {file: db/queries/boats.sql, query: BoatsNotIn}
live: "no"
test: integration
