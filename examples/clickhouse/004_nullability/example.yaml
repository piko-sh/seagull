summary: Ringed gulls and their sightings, where Nullable(String) gives a pointer and join_use_nulls decides whether a LEFT JOIN's unmatched row is NULL or each column's default.
differs:
  - Columns are NOT NULL unless declared Nullable(T), which maps to *T
  - "A LEFT JOIN fills an unmatched row with default values (\"\" and 0) unless join_use_nulls = 1, so in ListSightings Place is a plain string, empty for the gull never seen and printed here as (empty)"
  - "Seagull assumes the server's default, join_use_nulls = 0, unless the query sets it in SETTINGS or the database's ClickHouse dialect options say join_use_nulls: true"
  - "With the default fill, count(column) counts the unmatched row; SummariseGulls sets join_use_nulls = 1 so count gives 0 and max gives NULL"
  - count maps to uint64 and max(Date) to *time.Time
  - No UNIQUE constraint and no auto-increment, so each row's id is a parameter
entry: {file: db/queries/gulls.sql, query: SummariseGulls}
live: "no"
test: integration
