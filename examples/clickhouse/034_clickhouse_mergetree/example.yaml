summary: A harbour's berths, daily catch and species totals kept in ReplacingMergeTree, SummingMergeTree and AggregatingMergeTree tables, read with FINAL, -Merge combinators and PREWHERE.
differs:
  - "ReplacingMergeTree(version) keeps the highest version per sorting key when parts merge; FINAL applies that at read time"
  - "SummingMergeTree(kilos) adds up kilos across rows with the same key; FINAL sums at read time"
  - "AggregatingMergeTree columns hold AggregateFunction states, written with sumState and maxState and read with sumMerge and maxMerge"
  - "PREWHERE filters on one column before the others are read"
  - "A -Merge result has the type its function returns and is never NULL: sumMerge of a sum(UInt64) state is uint64, and maxMerge of a max(UInt32) state is uint32"
entry: {file: db/queries/harbour.sql, query: CurrentBerths}
live: "no"
test: integration
