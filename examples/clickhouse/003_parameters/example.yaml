summary: The ferry timetable again, where every Params field takes its name and Go type from a {name:Type} placeholder and a placeholder used twice binds once.
differs:
  - "Placeholders are {name:Type}: the name becomes the field and the type sets the Go type, so nothing is inferred from columns and no binding line is needed"
  - "Each placeholder is sent as p_<name>, so names such as limit and offset cannot clash with keywords"
  - "{seats:Int32} appears twice in BookSeats but is one field"
  - "ALTER TABLE ... UPDATE reports no changed rows, so BookSeats is asyncexec and the example compares seats_free before and after the booking"
  - No auto-increment, so each sailing's id is a parameter
entry: {file: db/queries/sailings.sql, query: FindSailings}
live: "no"
test: integration
