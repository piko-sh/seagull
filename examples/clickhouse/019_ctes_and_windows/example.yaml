summary: A gull colony read through a recursive CTE, a CTE feeding rank() and sum() window functions, and a view, with types and nullability carried through each.
differs:
  - "WITH RECURSIVE needs ClickHouse 24.4 or later, with the analyser that is on by default"
  - "join_use_nulls = 1 makes the LEFT JOINs give NULL, as in SQL, instead of default values"
  - "rank() OVER is a UInt64, and sum() OVER of a UInt64 is a UInt64 that sums no rows to 0, not NULL, so BeachRank and BeachThefts are plain uint64"
  - "Seagull types the recursive CTE's generation from generation + 1, a UInt16, so it is uint16; the server keeps the first SELECT's UInt8, and database/sql converts each value"
  - "count and uniqExact map to uint64 and max(Date) to *time.Time"
entry: {file: db/queries/gulls.sql, query: TheftLeague}
live: "no"
test: integration
