summary: Chip shop orders kept in JSON columns, encoded into the generated JSON type and searched with JSON_EXTRACT and JSON_UNQUOTE, with MariaDB handing each document back exactly as it was written.
differs:
  - "JSON is an alias for LONGTEXT with a CHECK (JSON_VALID(...)) constraint: an invalid document fails the constraint, and a valid one is stored as text"
  - "Documents come back byte for byte as written, keys in their original order and spacing; MySQL hands back its own normalised text"
  - "No -> or ->> operators: sgl vet reports Q010 for them and names the replacement, JSON_EXTRACT for -> and JSON_UNQUOTE(JSON_EXTRACT(...)) for ->>"
  - "JSON_EXTRACT writes the fragment it returns in MariaDB's own style, with a space after each comma, even though the stored document has none"
  - "The parameter compared with JSON_UNQUOTE(...) is inferred as a string, so sgl.param(fish) only names it (it would be p1); MySQL's ->> left it as any and needed type: text"
entry: {file: db/queries/orders.sql, query: OrdersWithFish}
live: "no"
test: integration
