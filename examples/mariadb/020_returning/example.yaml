summary: INSERT and DELETE with RETURNING, declared as one, hand back the rows they wrote, defaults and computed values included; MariaDB has no UPDATE ... RETURNING, so the update is execrows and a SELECT.
differs:
  - "RETURNING on INSERT, REPLACE and DELETE (MariaDB 10.5 and later), but not on UPDATE"
  - "The update is execrows followed by a SELECT of the rows it changed"
  - "? placeholders; BIGINT AUTO_INCREMENT maps to int64 and INT to int32"
  - "MySQL has no RETURNING at all; see concept 2 for execresult and LastInsertId"
entry: {file: db/queries/orders.sql, query: PlaceOrder}
live: "no"
test: integration
