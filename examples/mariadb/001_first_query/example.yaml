summary: A tasks table and three queries; MariaDB has INSERT ... RETURNING, so the insert hands back the new row as it would on SQLite or PostgreSQL.
differs:
  - "? placeholders"
  - "INSERT ... RETURNING, which MySQL lacks, so CreateTask is a one query rather than execresult"
  - "BIGINT AUTO_INCREMENT maps to int64; INT maps to int32"
  - "DATETIME maps to time.Time, which needs parseTime=true in the DSN"
  - "migrate_backend_mysql.New is the migration backend, as MariaDB speaks MySQL's protocol; WithDriverMultiStatements passes on the DSN's multiStatements setting"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: integration
