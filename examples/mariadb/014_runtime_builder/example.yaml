summary: Unclaimed lost property searched with filters, an order, a limit and a count chosen at run time, with unsafe columns, operators and directions refused.
differs:
  - "The builder binds every value with a plain ? placeholder, the only kind MariaDB takes"
  - "MariaDB has no -> or ->> JSON operators, so the builder's column grammar leaves out the JSON paths MySQL's accepts"
  - "The base query's WHERE makes runtime filters join with AND (hint Q022)"
  - "migrate_backend_mysql.New is the migration backend, as MariaDB speaks MySQL's protocol"
entry: {file: db/queries/lost_property.sql, query: SearchUnclaimed}
live: "no"
test: integration
expected_diagnostics: [Q022]
