summary: INSERT, UPDATE and DELETE with RETURNING, declared as one or many, hand back the rows they wrote, defaults and computed values included.
differs:
  - RETURNING on INSERT, UPDATE and DELETE (SQLite 3.35 and later)
  - SQLite does not promise an order for RETURNING rows, so the example sorts them
  - "? placeholders, numbered ?1, ?2 in the generated SQL; every INTEGER column, the primary key included, maps to int64"
entry: {file: db/queries/orders.sql, query: PlaceOrder}
live: "yes"
test: in-process
