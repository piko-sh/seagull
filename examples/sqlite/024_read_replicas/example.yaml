summary: NewWithReplica sends each query to the writer or the reader by Seagull's read-only detection; a mode=ro connection to the same file stands in for the replica.
differs:
  - SQLite has no replicas of its own, so a second connection opened with mode=ro plays the reader
  - SELECT is read-only and INSERT, UPDATE and DELETE are writes; SQLite has no writing CTEs or volatile functions to detect
  - "readonly: false on a SELECT keeps a read-after-write on the writer"
entry: {file: db/queries/sightings.sql, query: CountSightings}
live: "partial"
test: in-process
