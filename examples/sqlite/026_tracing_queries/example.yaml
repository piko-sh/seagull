summary: go.query_names generates QueryName, and a DBTX that wraps the connection and implements WrapDBTX names every query in its trace, inside RunInTx as well as outside.
differs:
  - "query_names: {enabled: true} adds query_names.go with QueryName(sql) string"
  - store.New and NewWithReplica keep a DBTX that implements WrapDBTX, and WithTx uses it to wrap the *sql.Tx
entry: {file: db/queries/shifts.sql, query: CoverShift}
live: "yes"
test: in-process
