summary: One landing of fish read back column by column, printing the Go type each declared SQLite type became.
differs:
  - Types follow each column's declared type, as SQLite itself has only five storage classes
  - Every type with INTEGER affinity, SMALLINT and BIGINT included, maps to int64, as SQLite stores any integer in up to eight bytes
  - REAL, DOUBLE and FLOAT all map to float64
  - DATETIME, DATE and TIMESTAMP map to time.Time, which modernc.org/sqlite parses from stored text
  - BOOLEAN maps to bool, stored as 0 and 1
  - No exact decimal type; DECIMAL maps to apd.Decimal, so the example keeps to integers
entry: {file: db/queries/landings.sql, query: GetLanding}
live: "yes"
test: in-process
