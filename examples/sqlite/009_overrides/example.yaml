summary: A chip shop menu read back as its own Status and Pence types, through a column override in sgl.yaml and sgl.column in a migration and in queries.
differs:
  - "SQLite has no enum type, so status is TEXT with a CHECK constraint and a go_type override"
  - "Money is INTEGER pence with a go_type, as SQLite has no exact decimal type"
  - "json_extract is typed any until sgl.column(kcal, type: integer) pins it"
  - "The example also imports its own internal/menu package"
entry: {file: db/queries/menu.sql, query: CheapestPerSection}
live: "yes"
test: in-process
