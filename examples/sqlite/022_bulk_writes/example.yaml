summary: A batch query takes a slice of Params and writes it as multi-row INSERTs, 249 four-column rows a statement to stay under 999 bind variables.
differs:
  - database/sql has no batch protocol, so batch becomes chunked multi-row INSERT statements
  - copyfrom generates the same chunked INSERTs as batch; only pgx uses COPY
  - chunks are sized for 999 bind variables, the default limit of SQLite before 3.32, so the code runs on older builds too
  - the method returns only error, and an empty slice sends nothing
entry: {file: db/queries/readings.sql, query: RecordReadings}
live: "yes"
test: in-process
