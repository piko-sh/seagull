summary: Chip shop orders kept as JSON documents, encoded into the generated JSON type and searched with -> and ->>.
differs:
  - "SQLite has no JSON storage type; a column declared JSON keeps the document's text and maps to the generated JSON type"
  - "-> extracts a JSON fragment, and ->> the SQL value the document holds, which Seagull types as any"
  - "The ->> result is cast to TEXT to make Address a *string"
  - "The ->> comparison's parameter is typed with sgl.param(fish, type: text), as inference leaves it as any"
entry: {file: db/queries/orders.sql, query: OrdersWithFish}
live: "yes"
test: in-process
