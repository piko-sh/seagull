summary: A namespaced migrator with before-run and after-migration hooks, a migration that must run outside a transaction, and a Seeder that applies each seed file once.
differs:
  - "SQLite cannot change journal_mode inside a transaction, so that migration carries sgl.migration(no_transaction: true)"
  - SQLite has no CREATE INDEX CONCURRENTLY; VACUUM is the statement Seagull detects as non-transactional without a directive
  - the seed file runs whole, since modernc.org/sqlite accepts several statements in one call
entry: {file: db/migrations/0002_write_ahead_log.up.sql}
live: "no"
test: in-process
