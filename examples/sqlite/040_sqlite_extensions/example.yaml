summary: A harbour guide searched by FTS5 full text, by R*Tree point-in-box and by json_each over a JSON array, with a generated column SQLite keeps up to date.
differs:
  - FTS5 and R*Tree tables are kept in step with the main table by a trigger in the migration
  - "MATCH names an FTS5 column (places_search.description), and rank orders the results"
  - "R*Tree coordinates are never NULL, so the point parameters are plain float64 values"
  - a generated column comes back through RETURNING, and writing to one is Q013
entry: {file: db/queries/places.sql, query: SearchDescriptions}
live: "partial"
