summary: INSERT ... ON CONFLICT DO UPDATE adds to an existing row through excluded and returns the result; DO NOTHING with execrows reports whether the insert happened.
differs:
  - "ON CONFLICT (column) DO UPDATE SET ... = excluded.column, as in PostgreSQL"
  - RETURNING on the upsert gives back the row as it ended up
  - DO NOTHING plus execrows tells the caller whether a row was inserted
entry: {file: db/queries/stock.sql, query: ReceiveDelivery}
live: "yes"
test: in-process
