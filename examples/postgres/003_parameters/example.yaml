summary: A ferry timetable whose Params structs take their field names from inserted and compared columns, binding lines and named placeholders.
differs:
  - "$N placeholders, and :name placeholders, which the generated SQL turns into $N"
  - "Binding lines name a placeholder by its number: -- $1 as sgl.param(earliest)"
  - "A named placeholder used twice, like :seats, becomes one $N and binds once"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/sailings.sql, query: FindSailings}
live: "no"
test: integration
