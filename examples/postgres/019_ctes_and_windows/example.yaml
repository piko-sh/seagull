summary: A gull colony read through a recursive CTE, a CTE feeding RANK and SUM window functions, and a view, with types and nullability carried through each; SUM of a bigint arrives as a decimal.
differs:
  - "$1 placeholders"
  - "COUNT and RANK are bigint (int64), and SUM of a bigint is numeric, so the windowed total is *apd.Decimal"
  - "stolen_on is a DATE, so the view's MAX(stolen_on) is a *time.Time"
  - "Selecting gulls.name under GROUP BY gulls.id is allowed because id is the primary key"
  - "SELECT * over the view is written out as its columns in the generated SQL, so adding a column to the view later does not break deployed code; go.keep_stars keeps the star"
  - "The recursive CTE is named descendants: FAMILY is a reserved word in CockroachDB, which runs this variant too"
  - "The example avoids LAG, LEAD and FIRST_VALUE, which Seagull types as any on PostgreSQL as well"
  - "Integer columns are BIGINT and the CTE starts from 0::BIGINT, so the Go types are the same on CockroachDB, where integers are 64-bit"
  - "id is an identity column, so ids count from 1 on CockroachDB too, where BIGSERIAL would give unique_rowid() values"
entry: {file: db/queries/gulls.sql, query: TheftLeague}
live: "no"
test: integration
