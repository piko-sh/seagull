summary: The landing read back through pgx, which decodes the same Row struct from PostgreSQL's binary formats, INTERVAL into time.Duration and an unmapped INET into a netip.Prefix.
differs:
  - "$1 placeholders"
  - "The Row and Params types are the same as database/sql's; pgx decodes the values itself"
  - "INTERVAL maps to time.Duration, which pgx decodes itself, counting a month as 30 days"
  - "INET has no mapping and arrives as any, which pgx fills with a netip.Prefix rather than a string"
  - "NUMERIC maps to apd.Decimal and UUID to uuid.UUID, which pgx fills through their Scan methods"
entry: {file: db/queries/landings.sql, query: GetLanding}
live: "no"
test: integration
