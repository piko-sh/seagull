summary: A harbour's landings read with DISTINCT ON, a LEFT JOIN LATERAL subquery, full-text search over a generated tsvector, and jsonb_each, then archived by a DELETE inside a CTE feeding an INSERT, every result typed.
differs:
  - "DISTINCT ON (boat_id) keeps the first row of each boat in ORDER BY order"
  - "LEFT JOIN LATERAL (...) ON true lets a subquery see the outer row; its columns become pointers, as a boat may have no landings"
  - "A TSVECTOR GENERATED ALWAYS AS (...) STORED column with a GIN index, matched with @@ websearch_to_tsquery and scored by ts_rank as *float32; :terms is used twice and bound once"
  - "jsonb_each used as a table gives key as string and value as store.JSON"
  - "A data-modifying CTE: DELETE ... RETURNING feeds INSERT ... SELECT, and the INSERT's RETURNING rows come back as one many query"
entry: {file: db/queries/harbour.sql, query: BiggestLandings}
live: "no"
test: integration
