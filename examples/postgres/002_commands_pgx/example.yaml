summary: The harbour's command kinds generated for pgx, where execresult hands back the server's pgconn.CommandTag and a missing row is pgx.ErrNoRows.
differs:
  - "$1 placeholders"
  - "execresult returns pgconn.CommandTag, such as UPDATE 1, instead of sql.Result"
  - "A one query that matches nothing returns pgx.ErrNoRows, which also matches sql.ErrNoRows with errors.Is"
  - "execrows reads CommandTag.RowsAffected, which cannot fail"
  - "MoorBoat is one with RETURNING id, as PostgreSQL has no last insert ID"
entry: {file: db/queries/boats.sql, query: MoveBerth}
live: "no"
test: integration
