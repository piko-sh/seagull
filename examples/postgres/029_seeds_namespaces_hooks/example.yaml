summary: A namespaced migrator with before-run and after-migration hooks and a logger, an index built CONCURRENTLY in a migration that runs outside a transaction, and a Seeder that applies each seed file once and warns when one changes.
differs:
  - "CREATE INDEX CONCURRENTLY cannot run inside a transaction; Seagull detects CONCURRENTLY by itself, and the migration also carries sgl.migration(no_transaction: true) to say so"
  - "IF NOT EXISTS keeps the no-transaction migration safe to retry if it ran but was not recorded"
  - "WithNamespace renames the advisory lock keys as well as the history tables"
  - "WithLogger routes Seagull's own warnings, such as an edited seed file, to your slog.Logger"
  - the seed file runs whole, since pgx's stdlib driver accepts several statements in one call
  - "sgl.yaml sets migrate.namespace and migrate.dsn, so sgl migrate and sgl seed use the same tables"
entry: {file: db/migrations/0002_menu_price_index.up.sql}
live: "no"
test: integration
