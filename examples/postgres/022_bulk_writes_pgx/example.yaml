summary: With go.driver pgx, batch queues one INSERT per row in a pgx.Batch sent at once, and copyfrom streams rows with COPY and returns how many it loaded.
differs:
  - "batch builds a pgx.Batch and reads every result; it returns only error"
  - "pgx runs a batch in one implicit transaction, so a failing row undoes the whole batch"
  - "copyfrom calls CopyFrom with the INSERT's table and columns and returns (int64, error), the number of rows copied"
  - "no chunking: neither a batch nor COPY binds the rows as variables of one statement"
  - "Both queries' Params structs have the same fields, so they convert into each other"
  - "the readings table is the database/sql variant's: keyed by (station, minute), with BIGINT columns"
entry: {file: db/queries/readings.sql, query: LoadReadings}
live: "no"
test: integration
