summary: The beach huts through pgx, where each IN ($1) slice is rewritten to = ANY($1) and sent as one array parameter.
differs:
  - "The pgx emitter rewrites IN ($1) to = ANY($1) when generating, so nothing is expanded at call time"
  - "The slice is one array parameter, so the SQL text is fixed, pgx can cache it, and there is no bind-variable limit"
  - "An empty slice is an empty array and a nil slice is NULL; = ANY matches nothing for either"
  - "No slice_helpers.go or bind_limits.go is generated"
entry: {file: db/queries/huts.sql, query: HutsOnBeaches}
live: "no"
test: integration
