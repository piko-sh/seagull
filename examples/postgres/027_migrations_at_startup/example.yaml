summary: The migration files are embedded in the binary, and each start-up runs migrate.NewMigrator with the PostgreSQL backend and Up, which applies only what the database lacks.
differs:
  - migrate_backend_postgres.New() runs each migration in a transaction, since PostgreSQL DDL is transactional
  - "it holds a session-level advisory lock, pg_advisory_lock on the history table's name, so instances starting together migrate one at a time"
  - the history lives in the sgl_migrations table of the same database
  - "behind PgBouncer in transaction mode use migrate_backend_postgres.NewPgBouncer(), which locks a table row instead"
entry: {file: db/migrations/0002_boat_home_port.up.sql}
live: "no"
test: integration
