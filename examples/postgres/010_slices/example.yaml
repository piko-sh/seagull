summary: Beach huts found and booked by passing Go slices to IN lists, including an empty slice and a slice after a scalar.
differs:
  - "Slice parameters use $N placeholders, numbered after every other parameter; the generated method expands IN ($N) to one $N per element"
  - "An empty slice turns IN ($N) into = ANY('{}'), which matches no row"
  - "Expansion stops at PostgreSQL's limit of 65535 bind variables with an error"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/huts.sql, query: HutsOnBeaches}
live: "no"
test: integration
