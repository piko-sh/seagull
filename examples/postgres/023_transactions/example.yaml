summary: RunInTx commits a transfer when its function returns nil and rolls it back on an error, and WithTx binds the queries to a transaction you begin yourself.
differs:
  - RunInTx and WithTx take a *sql.DB and a *sql.Tx from database/sql, opened with pgx's stdlib driver
  - "the CHECK constraint failure is a *pgconn.PgError; the example matches its SQLSTATE, 23514, as the message wording varies between servers"
  - "PostgreSQL takes row locks as each UPDATE runs, so other transactions can write to other accounts meanwhile"
  - ":amount and :id named placeholders become $1 and $2 in the generated SQL; without a name, the first would be inferred as balance"
  - "go.interface generates store.Querier, which printBalances takes, so one function reads through the database's queries and the transaction's alike"
entry: {file: db/queries/accounts.sql, query: Withdraw}
live: "no"
test: integration
