summary: Chip shop orders kept as JSONB documents, encoded into the generated JSON type and searched with ->, ->> and @>.
differs:
  - "JSONB stores a parsed document and returns it normalised, with spaces added and keys reordered"
  - "->> extracts text and -> extracts a JSONB fragment; keys are plain names, not $.paths"
  - "The ->> comparison's parameter is typed with sgl.param(fish, type: text), as inference leaves it as any"
  - "@> matches documents containing another, bound as $1::jsonb so the parameter is store.JSON"
  - "sgl.yaml shapes the rows for a JSON API: go.json_tags gives camel-case json tags with omitempty, go.struct_tags adds a db tag naming each column, and go.empty_slices makes an empty result encode as []"
entry: {file: db/queries/orders.sql, query: OrdersWithFish}
live: "no"
test: integration
