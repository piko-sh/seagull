summary: The same tasks table and queries generated for pgx, run on a pgxpool pool, with the migrations borrowing the pool through stdlib.OpenDBFromPool.
differs:
  - "$1 placeholders"
  - "go.driver: pgx makes DBTX pgx's interface, which *pgxpool.Pool, *pgx.Conn and pgx.Tx all satisfy"
  - "the migrator runs through database/sql, so main.go wraps the pool with stdlib.OpenDBFromPool"
  - "execrows reads RowsAffected from pgconn.CommandTag, which cannot fail"
  - "BIGSERIAL maps to int64, BOOLEAN to bool and TIMESTAMPTZ to time.Time, as with database/sql"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: integration
