summary: One landing of fish read back column by column, printing the Go type each PostgreSQL type became, from apd.Decimal and uuid.UUID to an unmapped INET as any.
differs:
  - "$1 placeholders"
  - "Every integer type maps by its width: SMALLINT, INTEGER and BIGINT give int16, int32 and int64"
  - "REAL is single precision and maps to float32; DOUBLE PRECISION maps to float64"
  - "NUMERIC maps to apd.Decimal and UUID to uuid.UUID, so example.go imports both packages"
  - "DATE and TIMESTAMPTZ map to time.Time; TIMESTAMPTZ arrives in the connection's time zone"
  - "INET has no mapping and arrives as any, which pgx's database/sql driver fills with a string"
entry: {file: db/queries/landings.sql, query: GetLanding}
live: "no"
test: integration
