summary: A chip shop menu read back as its own Status and Price types, through the types.decimal slot, a column override in sgl.yaml and sgl.column in a migration and in queries.
differs:
  - "Prices are NUMERIC(5, 2); the types.decimal: string slot maps NUMERIC to the server's exact text everywhere, in place of apd.Decimal"
  - "A go_type override then makes prices menu.Price in rows, models and parameters alike"
  - "nutrition ->> 'kcal' is nullable text, so its override sets type: bigint and nullable: false; a cast would also type it"
  - "status is TEXT with a CHECK constraint, as in SQLite; an enum column takes a column override the same way"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/menu.sql, query: CheapestPerSection}
live: "no"
test: integration
