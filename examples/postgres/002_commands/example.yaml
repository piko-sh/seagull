summary: One query per command kind on a harbour's boats, where the new ID comes back through RETURNING and execresult's sql.Result carries only RowsAffected.
differs:
  - "$1 placeholders"
  - "MoorBoat is one with RETURNING id, as PostgreSQL has no last insert ID"
  - "execresult returns sql.Result; pgx's driver fills in RowsAffected, and LastInsertId always fails"
  - "id is an identity column, so IDs count from 1 on CockroachDB too"
  - "BOOLEAN columns map to bool and take true and false"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/boats.sql, query: MoorBoat}
live: "no"
test: integration
