summary: INSERT ... ON CONFLICT DO UPDATE adds to an existing row through EXCLUDED and returns the result; DO NOTHING with execrows reports whether the insert happened.
differs:
  - "$1 placeholders"
  - "ON CONFLICT (column) DO UPDATE SET ... = EXCLUDED.column, the syntax SQLite borrowed"
  - "ON CONFLICT needs a unique index or constraint on the conflict columns, here the primary key"
  - "execrows reads RowsAffected from the pgx command tag: 1 for an insert, 0 for a skipped one"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/stock.sql, query: ReceiveDelivery}
live: "no"
test: integration
