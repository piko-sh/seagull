summary: INSERT, UPDATE and DELETE with RETURNING, declared as one or many, hand back the rows they wrote, defaults and computed values included.
differs:
  - "$1 placeholders"
  - "RETURNING on INSERT, UPDATE and DELETE; the id comes from a BIGINT identity column, as int64"
  - "PostgreSQL does not promise an order for RETURNING rows either, so the example sorts them"
  - "quantity is BIGINT and bigint * integer is bigint, so price_pence is int64"
  - "row: OrderLine gives ServeWaitingOrders and CancelOrder one shared row type, and model: orders reads ReopenOrder's RETURNING * into the table's model"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
  - "id is an identity column, so ids count from 1 on CockroachDB too, where BIGSERIAL would give unique_rowid() values"
entry: {file: db/queries/orders.sql, query: PlaceOrder}
live: "no"
test: integration
