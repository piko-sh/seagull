summary: Fishing voyages with TEXT[] and BIGINT[] columns read back as typed Go slices, searched with ANY and grouped with array_agg.
differs:
  - "database/sql cannot scan arrays, so the generated SQL wraps array columns in to_json() and decodes the JSON"
  - "A NULL array scans to a nil slice and an empty array to an empty one"
  - "PostgreSQL can hold NULL in any array, so rows read the elements as pointers, []*string and []*int64, and parameters take them too; non_null_elements: true opts out where the data never holds a NULL element, as the migration declares for ports, which reads and binds as []string"
  - "Slice parameters are sent as PostgreSQL arrays by pgx's database/sql driver; a nil slice is NULL"
  - "$1::text = ANY(ports) casts its parameter, which types it for Seagull and for CockroachDB"
  - "A subscript such as ports[1] is nullable, as a missing element is NULL"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/voyages.sql, query: ListVoyages}
live: "no"
test: integration
