summary: A tasks table and three queries through pgx's database/sql driver; BIGSERIAL becomes int64, TIMESTAMPTZ becomes time.Time and RETURNING hands back the new row.
differs:
  - "$1 placeholders"
  - "BIGSERIAL maps to int64, BOOLEAN to bool and TIMESTAMPTZ to time.Time"
  - "database/sql opens the database with pgx's stdlib driver, registered as \"pgx\""
  - "Migrations run with the migrate_backend_postgres.New() backend, which takes an advisory lock"
  - "sgl.yaml sets migrate.dsn from DATABASE_URL, so sgl migrate can reach the server"
  - "go.doc_comments turns the comment above each query into its method's doc comment, and COMMENT ON TABLE and COMMENT ON COLUMN into the model's and the field's"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: integration
