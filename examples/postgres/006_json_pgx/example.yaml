summary: The chip shop's JSONB orders through pgx, which reads store.JSON through its Scan method and decodes a basket straight into a struct named by a go_type override.
differs:
  - "store.JSON implements driver.Valuer and sql.Scanner, which pgx calls too, so the type is the same as database/sql's"
  - "pgx decodes JSONB into any Go type, so a go_type override on basket returns a chips.Basket with no json.Unmarshal"
  - "The override changes the returned column only; PlaceOrderParams still takes store.JSON"
  - "The ->> comparison's parameter is typed with sgl.param(fish, type: text), and @> binds $1::jsonb"
entry: {file: db/queries/orders.sql, query: GetOrder}
live: "no"
test: integration
