summary: RunInTx begins a pgx transaction on the pool, commits a transfer when its function returns nil and rolls it back on an error; WithTx binds the queries to a pgx.Tx you begin yourself.
differs:
  - "RunInTx takes any store.DBTX that can Begin, such as the *pgxpool.Pool; on a pgx.Tx, Begin starts a savepoint"
  - "WithTx takes a pgx.Tx, and Commit and Rollback take a context"
  - "the CHECK constraint failure is a *pgconn.PgError; the example matches its SQLSTATE, 23514, as the message wording varies between servers"
  - ":amount and :id named placeholders become $1 and $2 in the generated SQL; without a name, the first would be inferred as balance"
entry: {file: db/queries/accounts.sql, query: Withdraw}
live: "no"
test: integration
