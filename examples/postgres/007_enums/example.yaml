summary: Boats with a status from a CREATE TYPE ... AS ENUM, read as the store.BoatStatus type Seagull generates and then as a typed harbour.Status through a go_type override.
differs:
  - "CREATE TYPE ... AS ENUM declares the labels, and the server refuses any other value"
  - "The enum becomes a named string type in models.go, named after the enum type (store.BoatStatus), with a constant per label and a Valid method, used in models.go, Params and Row structs"
  - "sgl.column(status, go_type: ...) makes one query return harbour.Status; parameters stay store.BoatStatus"
entry: {file: db/queries/boats.sql, query: BoatsWithStatus}
live: "no"
test: integration
