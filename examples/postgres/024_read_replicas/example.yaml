summary: NewWithReplica sends each query to the writer or the reader by Seagull's read-only detection, which on PostgreSQL also catches FOR UPDATE, writing CTEs and calls of functions that change data; a pool with default_transaction_read_only plays the replica.
differs:
  - "A second pool opened with default_transaction_read_only=on stands in for a hot standby; pass -replica for a real one"
  - "SELECT ... FOR UPDATE and a CTE that runs DELETE are writes, so they go to the writer"
  - "A SELECT calling a function whose body inserts a row goes to the writer; one calling a function that only reads stays on the reader, whatever its volatility"
  - "readonly: false on a SELECT keeps a read-after-write on the writer"
  - "A function argument has no column to take a name from, so LogSighting names its parameters with :species and :place"
  - "The reader refuses writes with SQLSTATE 25006, read_only_sql_transaction"
entry: {file: db/queries/sightings.sql, query: LogSighting}
live: "no"
test: integration
