summary: Tide gauge readings ranged over one row at a time with a range-over-func iterator, once to the end and once stopping early, as on SQLite.
differs:
  - "$1 placeholders"
  - "StreamReadings returns func(func(StreamReadingsRow, error) bool), the shape of iter.Seq2, with every engine"
  - "Breaking out closes the rows, and pgx reads and discards what the server has still to send; add LIMIT when only the first rows matter"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/readings.sql, query: StreamReadings}
live: "no"
test: integration
