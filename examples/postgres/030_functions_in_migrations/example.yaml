summary: SQL and PL/pgSQL functions created in a migration type the queries that call them, and whether they change data, read from their bodies or stated by a sgl.migration(readonly:) line, decides whether each query goes to the writer or the reader.
differs:
  - "Function data access determines read-only routing, independently of volatility; sgl.migration(readonly:) before CREATE FUNCTION can state it explicitly"
  - "Seagull scans function bodies, SQL and PL/pgSQL alike, and a function that calls a writing function writes too"
  - "STRICT returns NULL for a NULL argument; these queries have nullable function results, so their generated fields are pointers"
  - "RETURNS TABLE makes a function a relation with typed columns, and a $1 passed to it takes the argument's type"
  - "A function argument has no column to take a name from, so the queries name theirs with :boat, :species and :grams"
entry: {file: db/migrations/0002_market_functions.up.sql}
live: "no"
test: integration
