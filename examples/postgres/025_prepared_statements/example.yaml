summary: go.prepared generates Prepare, which prepares every query once at start-up and returns a PreparedDBTX that store.New runs them through.
differs:
  - Prepare takes the *sql.DB; RunInTx takes it back through UnderlyingDB
  - "inside RunInTx the queries still use the prepared statements: PreparedDBTX's WrapDBTX binds each one to the *sql.Tx with StmtContext"
  - PostgreSQL prepares a statement per session, and database/sql re-prepares it on each pooled connection it uses
  - "pgx's driver already caches a prepared statement per connection for every query, so the main gain is that a query which no longer fits the schema fails at start-up"
  - "Integer columns are BIGINT, so the Go types are the same on CockroachDB, whose INTEGER is 64-bit"
entry: {file: db/queries/tide_times.sql, query: HighTide}
live: "no"
test: integration
