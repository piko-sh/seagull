version: 1

engines:
  sqlite: {title: SQLite, dialect: sqlite, module: sqlite}
  postgres: {title: PostgreSQL, dialect: postgres, module: postgres}
  cockroachdb: {title: CockroachDB, dialect: cockroachdb, module: cockroachdb, twin: postgres}
  timescaledb: {title: TimescaleDB, dialect: timescaledb, module: timescaledb, twin: postgres}
  mysql: {title: MySQL, dialect: mysql, module: mysql}
  mariadb: {title: MariaDB, dialect: mariadb, module: mariadb, twin: mysql}
  duckdb: {title: DuckDB, dialect: duckdb, module: duckdb}
  clickhouse: {title: ClickHouse, dialect: clickhouse, module: clickhouse}

columns:
  - {id: sqlite, engine: sqlite, driver: database/sql, suffix: ""}
  - {id: postgres, engine: postgres, driver: database/sql, suffix: ""}
  - {id: postgres-pgx, engine: postgres, driver: pgx, suffix: "_pgx"}
  - {id: cockroachdb, engine: cockroachdb, driver: database/sql, suffix: ""}
  - {id: timescaledb, engine: timescaledb, driver: database/sql, suffix: ""}
  - {id: mysql, engine: mysql, driver: database/sql, suffix: ""}
  - {id: mariadb, engine: mariadb, driver: database/sql, suffix: ""}
  - {id: duckdb, engine: duckdb, driver: database/sql, suffix: ""}
  - {id: clickhouse, engine: clickhouse, driver: database/sql, suffix: ""}
  - {id: clickhouse-native, engine: clickhouse, driver: clickhouse, suffix: "_native"}

tracks:
  - {id: start, title: Getting started, tone: harbour}
  - {id: types, title: Types and nullability, tone: teal}
  - {id: dynamic, title: Dynamic queries, tone: lilac}
  - {id: shaping, title: Shaping results, tone: kelp}
  - {id: writing, title: Writing data, tone: coral}
  - {id: connections, title: Connections and transactions, tone: slate}
  - {id: migrations, title: Migrations and seeds, tone: beak}
  - {id: engines, title: Engine features, tone: gonys}
  - {id: tooling, title: Tooling, tone: harbour}
  - {id: embedding, title: Embedding Seagull, tone: lilac}

concepts:
  - number: 1
    slug: first-query
    title: Your first query
    track: start
    summary: Write a migration and three annotated queries, generate, and call the result.
    teaches: [sgl.yaml, "sgl.query(name, one|many|execrows)", models.go and Row structs, store.New, go.doc_comments]
    docs: [tutorials/01-first-query, "how-to/shape-generated-code#write-doc-comments-from-the-sql"]
    cells:
      sqlite: {status: variant}
      postgres: {status: variant}
      postgres-pgx: {status: variant}
      cockroachdb: {status: variant}
      timescaledb: {status: equivalent, twin: postgres}
      mysql: {status: variant}
      mariadb: {status: variant}
      duckdb: {status: variant}
      clickhouse: {status: variant}
      clickhouse-native: {status: variant}

  - number: 2
    slug: commands
    title: "Choosing a command: one, many, exec, execrows, execresult"
    track: start
    summary: Each command kind gives a different Go signature; pick the one that matches what the caller needs back.
    teaches: [one, many, exec, execrows, execresult]
    diagnostics: [Q009]
    docs: ["reference/directives#command-kinds", how-to/choose-query-command]
    cells:
      sqlite: {status: variant}
      postgres: {status: variant}
      postgres-pgx: {status: variant}
      cockroachdb: {status: equivalent, twin: postgres}
      timescaledb: {status: equivalent, twin: postgres}
      mysql: {status: variant}
      mariadb: {status: equivalent, twin: mysql}
      duckdb: {status: omitted}
      clickhouse: {status: omitted}
      clickhouse-native: {status: unsupported, reason: "The native ClickHouse driver reports no affected rows or result, so execrows and execresult are refused when generating."}

