summary: A ferry timetable whose Params structs take their field names from inserted and compared columns and from binding lines, with ?1 used twice.
differs:
  - "MySQL takes only ? placeholders; Seagull also reads ?N, and rewrites each use to ? with its value repeated"
  - "BookSeats uses ?1 twice where SQLite uses :seats twice, as a reused :name placeholder loses its second value on MySQL"
  - "Times of day are kept in CHAR(5), as in the SQLite version's TEXT"
entry: {file: db/queries/sailings.sql, query: FindSailings}
live: "no"
test: integration
