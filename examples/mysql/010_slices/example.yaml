summary: Beach huts found and booked by passing Go slices to IN lists, including an empty slice and a slice after a scalar.
differs:
  - "Slice parameters use numbered ?N placeholders in the query file; the generated SQL writes every ?N as ?, and at call time the generated method writes one ? per element"
  - "An empty slice turns IN (?N) into IN (SELECT NULL FROM DUAL WHERE FALSE), which matches no row"
  - "Expansion stops at MySQL's limit of 65,535 bind variables a statement with an error"
entry: {file: db/queries/huts.sql, query: HutsOnBeaches}
live: "no"
test: integration
