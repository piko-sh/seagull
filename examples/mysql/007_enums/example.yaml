summary: A chip shop menu with two MySQL ENUM columns, read back as the named enum types Seagull generates and, through a column override and sgl.column, as the shop's own Go types.
differs:
  - "ENUM('fish', 'sides', 'puddings') is declared on the column itself; ORDER BY sorts its values in declaration order"
  - "Each ENUM becomes a named string type in models.go, named after its table and column (store.MenuItemsSection), with a constant per value and a Valid method"
  - "An inline ENUM has no type name for a sql: override, so a column override in types.overrides gives menu_items.status your own type, in models.go, rows and the parameters bound to it"
  - "sgl.column(section, go_type: ...) changes only the column ItemsInSection returns; its parameter stays the generated store.MenuItemsSection"
  - "Strict mode refuses a value the ENUM does not list, reporting it as data truncated"
entry: {file: db/queries/menu.sql, query: ItemsInSection}
live: "no"
test: integration
