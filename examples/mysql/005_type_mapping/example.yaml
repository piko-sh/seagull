summary: One landing of fish read back column by column, printing the Go type each MySQL column type became, unsigned integers and DECIMAL included.
differs:
  - "UNSIGNED integers map to unsigned Go types of the same width: TINYINT UNSIGNED is uint8"
  - "BOOLEAN is TINYINT(1) and maps to bool"
  - "DATETIME maps to time.Time, which go-sql-driver/mysql returns only with parseTime=true in the DSN"
  - "VARBINARY maps to []byte"
  - "DECIMAL(6, 2) is a real exact type and maps to apd.Decimal; the insert binds it as text with sgl.param(type: text)"
  - "No RETURNING, so the new id comes from LastInsertId"
entry: {file: db/queries/landings.sql, query: GetLanding}
live: "no"
test: integration
