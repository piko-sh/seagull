summary: The migration files are embedded in the binary, and each start-up runs migrate.NewMigrator with the MySQL backend and Up, which applies only what the database lacks.
differs:
  - "migrate_backend_mysql.New() holds a GET_LOCK advisory lock, keyed within the current schema, so instances starting together migrate one at a time"
  - "MySQL commits DDL as each statement runs, so a migration cannot be rolled back as a whole; each one here is a single statement"
  - "the history lives in the sgl_migrations table of the same database"
  - "with migrate.WithDriverMultiStatements(true), for a DSN that sets multiStatements=true, the same backend runs seed files whole"
entry: {file: db/migrations/0002_boat_home_port.up.sql}
live: "no"
test: integration
