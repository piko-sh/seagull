summary: INSERT ... ON DUPLICATE KEY UPDATE adds to an existing row through VALUES(), and its affected-row count of 1 or 2 says whether the row was inserted or updated.
differs:
  - "ON DUPLICATE KEY UPDATE fires on any primary or unique key clash; there is no conflict target to name"
  - "VALUES(column) is the value the INSERT tried to write, where SQLite and PostgreSQL use excluded.column; MySQL 8.0.19 and later prefer a row alias (VALUES (...) AS new), which MariaDB rejects"
  - "No RETURNING: execrows counts 1 for an insert and 2 for an update, and a follow-up SELECT reads the row"
  - "ON DUPLICATE KEY UPDATE item = item stands in for DO NOTHING, counting 0 rows when the row exists"
entry: {file: db/queries/stock.sql, query: ReceiveDelivery}
live: "no"
test: integration
