summary: Ringed gulls and their sightings, where a nullable column, a LEFT JOIN and MAX give pointers while COALESCE and COUNT do not.
differs:
  - "seen_on is a DATE, so MAX(seen_on) arrives as *time.Time rather than *string"
  - "COUNT maps to int64"
  - "The COALESCE fallback is the ring itself: || is logical OR in MySQL, and Seagull types CONCAT as nullable even when its arguments are not"
entry: {file: db/queries/gulls.sql, query: SummariseGulls}
live: "no"
test: integration
