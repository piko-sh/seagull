summary: One query per command kind on a harbour's boats, from execresult's LastInsertId to exec's bare error.
differs:
  - "? placeholders"
  - "No RETURNING (sgl vet reports Q052), so execresult and LastInsertId are how an INSERT reports the AUTO_INCREMENT id"
  - "BOOLEAN is TINYINT(1) in MySQL and maps to bool"
  - "execrows counts rows changed, not rows matched, unless the DSN sets clientFoundRows=true"
