summary: Stored functions created in a migration type the queries that call them, and their data-access characteristic, body or a sgl.migration(readonly:) line decides whether each query goes to the writer or the reader.
differs:
  - "NO SQL and READS SQL DATA functions are read-only; MODIFIES SQL DATA, or an INSERT, UPDATE or DELETE in the body, makes a query write unless sgl.migration(readonly: true) precedes the CREATE FUNCTION"
  - "MySQL never checks a characteristic against the body, and refuses a function that is not DETERMINISTIC, NO SQL or READS SQL DATA while binary logging is on"
  - "A BEGIN ... END body needs no DELIMITER line in a migration; DELIMITER is a mysql client command, not SQL"
  - "No table-valued functions, so BoatHaul joins the tables itself and calls price_pence per row"
  - "Function arguments have no column to name them, so ?1 as sgl.param(boat) names them"
entry: {file: db/migrations/0002_market_functions.up.sql}
live: "no"
test: integration
