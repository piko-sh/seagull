summary: A harbour register kept with INSERT IGNORE, REPLACE INTO, a SET column read with FIND_IN_SET, unsigned integers and GROUP_CONCAT, printing what each statement did.
differs:
  - "SET columns map to string: the chosen values joined by commas, stored in the SET's own order, once each"
  - "UNSIGNED integers map to Go's unsigned types: INT UNSIGNED to uint32, TINYINT UNSIGNED to uint8"
  - "INSERT IGNORE counts 0 rows for a duplicate key, and also turns other errors, such as an unknown SET value, into warnings"
  - "REPLACE INTO deletes every row that clashes on any unique key before it inserts, and execrows counts those deletions"
  - "GROUP_CONCAT is nullable, as a group with no matching rows gives NULL"
  - "Backticks quote rank, a reserved word since MySQL 8.0"
  - "A column's COMMENT and the table's COMMENT = option become doc comments on the model and its fields under go.doc_comments"
entry: {file: db/queries/harbour.sql, query: AssignBerth}
live: "no"
test: integration
