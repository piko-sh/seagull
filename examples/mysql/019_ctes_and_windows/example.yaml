summary: A gull colony read through a recursive CTE, a CTE feeding RANK and SUM window functions, and a view, with types and nullability carried through each.
differs:
  - "WITH RECURSIVE and window functions need MySQL 8.0 or later"
  - "SUM over integers returns DECIMAL in MySQL, so the beach total is *apd.Decimal"
  - "stolen_on is a DATE, so the view's MAX(stolen_on) arrives as *time.Time"
entry: {file: db/queries/gulls.sql, query: TheftLeague}
