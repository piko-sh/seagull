summary: A tasks table and three queries; MySQL has no RETURNING, so the insert is execresult and LastInsertId hands back the AUTO_INCREMENT id.
differs:
  - "? placeholders"
  - "No RETURNING: CreateTask is execresult, and sql.Result's LastInsertId gives the new id"
  - "BIGINT AUTO_INCREMENT maps to int64, matching LastInsertId; INT maps to int32"
  - "DATETIME maps to time.Time, which needs parseTime=true in the DSN"
  - "migrate_backend_mysql.New is the migration backend, taking a GET_LOCK advisory lock; WithDriverMultiStatements passes on the DSN's multiStatements setting"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: integration
