summary: Three replicas start at once and each runs migrate.NewMigrator with the CockroachDB backend and Up; its lock table lets one apply the migrations while the others wait and find nothing left.
differs:
  - migrate_backend_cockroachdb.New() locks with a row in sgl_migration_lock held by SELECT ... FOR UPDATE, since CockroachDB has no advisory locks; asking it for LockAdvisory returns ErrUnsupportedLock
  - the lock transaction pins one connection and the migrations run on a second, because CockroachDB rejects a BEGIN nested in the lock transaction
  - migrations do not run in a transaction, because CockroachDB cannot roll a schema change back with the rest of a transaction; the backend records each finished statement, so a failed file is marked dirty and resumes; each file holds one schema change
  - the backend turns on enable_durable_locking_for_serializable for its lock transaction, so a range split during a schema change cannot drop the lock; that needs CockroachDB 23.2 or later
  - unique_rowid() keys change on every run, so the harbour is listed by name without IDs
