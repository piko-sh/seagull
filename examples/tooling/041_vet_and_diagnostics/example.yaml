summary: sgl vet reports a warning in the project and an error with a caret and a suggestion in broken/, --strict fails on the warning, sgl generate writes every query but the broken one, and sgl explain describes a code.
differs:
  - warnings exit 0 unless --strict; errors always exit 1
  - "-c broken/sgl.yaml points sgl at the second project; paths in its output stay relative to where sgl runs"
  - "an error stops only its own query: sgl generate leaves FindTasks out, writes the rest of the package and exits 1"
entry: {file: db/queries/tasks.sql, query: FinishTask}
live: "no"
test: transcript
expected_diagnostics: [Q009, Q027]
