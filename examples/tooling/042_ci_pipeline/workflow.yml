name: sgl

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  sgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generated code is up to date
        run: go tool sgl generate --check --diff

      - name: Queries have no problems
        run: go tool sgl vet --strict --format github

      - name: Migrations apply and validate
        run: |
          go tool sgl migrate up --dsn file:ci.db
          go tool sgl migrate validate --dsn file:ci.db

      - name: Write SARIF for code scanning
        if: always()
        run: go tool sgl vet --format sarif > sgl.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sgl.sarif
