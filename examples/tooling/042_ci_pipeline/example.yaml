summary: A CI job catches a query edited without regenerating, prints the diff, reports the change's warning as a GitHub annotation and as SARIF, and validates the migrations against a throwaway SQLite file.
differs:
  - "go tool sgl runs the sgl that go.mod's tool directive pins (see ../go.mod and workflow.yml)"
  - generate --check exits 1 when the committed code is stale; adding --diff prints what would change
  - "vet --format github prints ::warning and ::error workflow commands; --format sarif prints SARIF 2.1.0"
  - migrate up and validate run against file:ci.db, a SQLite file the job throws away
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: transcript
expected_diagnostics: [Q046]
