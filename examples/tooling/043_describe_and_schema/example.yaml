summary: sgl describe prints a query's parameters, columns and Go signature, schema dump prints the schema the migrations build, and schema diff finds a hand-made change in a SQLite file.
differs:
  - "SQLite types print in their normalised form: INTEGER PRIMARY KEY is bigint, as the rowid, and other INTEGER columns integer, and every one maps to int64"
  - "schema diff opens the database with --dsn file:drift.db; + marks what only the database has, - what only the migrations have"
  - SQLite can be introspected, so schema diff and schema dump --from-db work against a live file
entry: {file: db/queries/books.sql, query: ListBooksByAuthor}
live: "no"
test: transcript
