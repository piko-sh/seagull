summary: sgl fmt lists, checks and rewrites directives written with the seagull. alias, require_canonical turns the alias into Q050 hints, a directive with another tool's prefix draws Q051 until a one-off configuration adopts it, and --rewrite-prefix switches spelling.
differs:
  - "directives.prefixes: [sgl, seagull] makes sgl canonical and seagull an alias; require_canonical: true reports each alias"
  - "fmt -l and --check list files; -w rewrites them; without either fmt prints the formatted file"
  - "adopt.yaml lists the other tool's prefix as an alias, so sgl -c adopt.yaml fmt -w rewrites it to sgl"
entry: {file: db/queries/customers.sql}
live: "no"
test: transcript
expected_diagnostics: [Q050, Q051]
