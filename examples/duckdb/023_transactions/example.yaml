summary: RunInTx commits a transfer when its function returns nil and rolls it back on an error, and WithTx binds the queries to a transaction you begin yourself.
differs:
  - RunInTx and WithTx take a *sql.DB and a *sql.Tx from database/sql
  - "DuckDB uses optimistic concurrency: two transactions that write the same row conflict, and the later one fails"
  - a CHECK constraint failure is the error that triggers the rollback here
  - "Named :amount and :id placeholders, as on SQLite"
entry: {file: db/queries/accounts.sql, query: Withdraw}
live: "no"
test: cgo
