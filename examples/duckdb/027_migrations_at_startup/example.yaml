summary: The migration files are embedded in the binary, and each start-up runs migrate.NewMigrator with the DuckDB backend and Up, which applies only what the database lacks.
differs:
  - migrate_backend_duckdb.New() runs each migration in a transaction with its history row, since DuckDB DDL is transactional
  - "The backend binds its own queries with $N placeholders and takes no lock: DuckDB has none, and one process at a time opens a database file for writing"
  - "DuckDB cannot add a NOT NULL column to an existing table, so 0002 adds home_port with a default and it maps to *string"
  - the history lives in the sgl_migrations table of the same database
  - "The program uses an in-memory database by default; -db keeps it in a file so a second run finds nothing to migrate"
entry: {file: db/migrations/0002_boat_home_port.up.sql}
live: "no"
test: cgo
