summary: Fishing voyages with VARCHAR[] and INTEGER[] list columns read back as typed Go slices, searched with ANY and grouped with array_agg.
differs:
  - "DuckDB calls arrays lists: VARCHAR[] and INTEGER[] declare them, and they count from 1"
  - "DuckDB can hold NULL in any list, so rows read the elements as pointers, []*string and []*int32, while parameters take plain []string and []int32; non_null_elements: true opts out where the data never holds a NULL element"
  - "The generated SQL selects list columns as written, and the generated code reads the lists duckdb-go returns into the slices, where PostgreSQL on database/sql reads arrays through to_json()"
  - "duckdb-go binds a nil slice as an empty list, so the generated code converts a nullable list parameter and binds nil as NULL: voyage 2's sightings come back NULL, voyage 3's empty"
  - "array_length(ports) counts the elements; DuckDB's cardinality works on maps only"
  - "$1 = ANY(ports) needs sgl.param(port, type: varchar), as inference leaves it as any"
entry: {file: db/queries/voyages.sql, query: ListVoyages}
live: "no"
test: cgo
