summary: Chip shop orders kept as JSON documents, read into the generated JSON type and searched with -> and ->>.
differs:
  - "DuckDB has a JSON type, VARCHAR underneath, that rejects malformed documents as they are stored"
  - "The generated SQL casts a JSON column to VARCHAR, so store.JSON holds the document as stored, keys in the order they were written"
  - "->> extracts text and -> extracts a JSON fragment, as on SQLite"
  - "PlaceOrder takes store.JSON, and the generated code hands duckdb-go the document's text, the only form it binds a JSON value in"
  - "The ->> comparison's parameter is typed with sgl.param(fish, type: varchar), as inference leaves it as any"
entry: {file: db/queries/orders.sql, query: OrdersWithFish}
live: "no"
test: cgo
