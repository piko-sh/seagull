summary: One landing of fish read back column by column, printing the Go type each DuckDB column type became, from unsigned and 128-bit integers to UUIDs.
differs:
  - Every column has an exact type, so the mapping follows the declared type directly
  - REAL is a 4-byte float and maps to float32; DOUBLE maps to float64
  - Unsigned types map to Go unsigned integers, e.g. UTINYINT to uint8
  - HUGEINT maps to *big.Int, the type duckdb-go returns, even when the column is NOT NULL
  - DATE and TIMESTAMP map to time.Time, and UUID to uuid.UUID
  - "DECIMAL and INTERVAL are left out: their default Go types, apd.Decimal and string, do not round-trip through duckdb-go yet, which returns an INTERVAL as its own duckdb.Interval"
entry: {file: db/queries/landings.sql, query: GetLanding}
live: "no"
test: cgo
