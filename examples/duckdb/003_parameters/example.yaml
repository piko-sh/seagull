summary: A ferry timetable whose Params structs take their field names from inserted and compared columns, binding lines and named placeholders.
differs:
  - "DuckDB accepts $N positional and :name named placeholders"
  - "sgl rewrites each :name to $N in the generated SQL, so :seats used twice binds once"
  - "The id comes from a sequence, as DuckDB has no auto-incrementing key"
entry: {file: db/queries/sailings.sql, query: FindSailings}
live: "no"
test: cgo
