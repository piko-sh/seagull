summary: A tasks table and three queries; a sequence supplies the ids, RETURNING hands back the new row, and BOOLEAN and TIMESTAMP arrive as bool and time.Time.
differs:
  - "$N placeholders"
  - "No auto-incrementing key: the id column defaults to nextval('task_ids') from a CREATE SEQUENCE"
  - BIGINT maps to int64 and INTEGER to int32
  - BOOLEAN maps to bool and TIMESTAMP to time.Time
  - DuckDB runs in the program's process through cgo, with an in-memory database by default
  - "Migrations run with the migrate_backend_duckdb.New() backend, which takes no lock"
entry: {file: db/queries/tasks.sql, query: CreateTask}
live: "no"
test: cgo
