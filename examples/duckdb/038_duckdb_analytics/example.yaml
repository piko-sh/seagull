summary: A week of fish landings analysed with QUALIFY, FILTER, PIVOT, a scalar macro, a table macro and read_parquet over a price list the program writes with COPY TO.
differs:
  - "QUALIFY filters on a window function and keeps the table's column types"
  - "SUM of an INTEGER is a HUGEINT in DuckDB, so the FILTER totals arrive as *big.Int"
  - "A scalar macro is typed through the CAST in its body; a table macro's columns are typed from the SELECT in its body"
  - "read_parquet takes its path as a bound parameter; Seagull cannot see the file's columns, so sgl vet warns Q001 and CASTs give the types"
  - "PIVOT ... ON species IN (...) gives one typed column per listed value, the same columns as the FILTER query"
  - "run takes the Parquet file's path, which main.go and the test write with COPY ... TO"
entry: {file: db/queries/landings.sql, query: LandingValues}
live: "no"
test: cgo
expected_diagnostics: [Q001]
