summary: A chip shop menu with two DuckDB enum columns, read back as the named enum types Seagull generates and, through a SQL type override and sgl.column, as the shop's own Go types.
differs:
  - "CREATE TYPE ... AS ENUM declares the enum; ORDER BY sorts its values in declaration order"
  - "Each enum becomes a named string type in models.go, named after the enum type, with a constant per value (store.SectionFish) and a Valid method"
  - "A types.overrides entry with sql: naming the enum type gives every column of that enum, and the parameters bound to them, your own type, and the generated package declares none for it"
  - "sgl.column(section, go_type: ...) changes only the column ItemsInSection returns; its parameter stays the generated store.Section"
  - "DuckDB refuses a value the enum does not list, with an error naming its UINT8 storage type"
entry: {file: db/queries/menu.sql, query: ItemsInSection}
live: "no"
test: cgo
