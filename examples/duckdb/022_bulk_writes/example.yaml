summary: A batch query takes a slice of Params and writes it as multi-row INSERTs, 16383 four-column rows a statement to stay under 65535 bind variables.
differs:
  - database/sql has no batch protocol, so batch becomes chunked multi-row INSERT statements
  - copyfrom generates the same chunked INSERTs as batch; only pgx uses COPY
  - "Chunks are sized for 65535 bind variables, so the example writes a week of readings to need two statements"
  - the method returns only error, and an empty slice sends nothing
entry: {file: db/queries/readings.sql, query: RecordReadings}
live: "no"
test: cgo
